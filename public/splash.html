<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment57 - Node Established</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="terminal-frame">
        <!-- Exact Matching Banner Layout -->
        <div class="terminal-banner">
            <h1>Experiment57</h1>
        </div>

        <!-- Terminal Diagnostic Matrix Container -->
        <div class="readout-manifest">
            <div class="readout-line">
                <span class="manifest-label">hi:</span>
                <span id="display-user">...</span>
            </div>
            
            <div class="readout-line">
                <span class="manifest-label">bundle bought:</span>
                <span id="display-bundle">...</span>
            </div>
            
            <div class="readout-line">
                <span class="manifest-label">time until expiry:</span>
                <span id="display-timer">01 hr:23min:12sec</span>
            </div>
            
            <div class="readout-line">
                <span class="manifest-label">1 logged in device:</span>
                <span id="display-device">TECHNO SPARK 20C</span>
            </div>
        </div>
    </div>

    <!-- External script to parse variables -->
    <script src="js/splash.js"></script>
</body>
</html>
